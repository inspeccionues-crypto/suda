<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Suda en realidad aumentada</title>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: system-ui, sans-serif; }
  .a-enter-vr, .a-enter-ar { display: none !important; }
  #aviso {
    position: fixed; left: 16px; right: 16px; bottom: 24px; z-index: 10;
    background: rgba(14,58,94,.88); color: #fff; border: 3px solid #f27824;
    border-radius: 16px; padding: 12px 16px; text-align: center; font-size: 17px; line-height: 1.35;
    transition: opacity .4s;
  }
  #aviso.oculto { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="aviso">Apunta la cámara a la portada del almanaque</div>

<a-scene
  mindar-image="imageTargetSrc: ./portada.mind; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001"
  color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true"
  vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

  <a-assets>
    <img id="suda" src="./suda.png" crossorigin="anonymous">
    <img id="globo" src="./globo.png" crossorigin="anonymous">
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="ancla" mindar-image-target="targetIndex: 0">
    <!-- Suda sale de la hoja hacia el lector -->
    <a-entity id="sale" position="0 -0.05 0" scale="0.001 0.001 0.001">
      <a-entity id="flota">
        <a-image src="#suda" width="0.49" height="0.6"
                 material="transparent: true; alphaTest: 0.05; side: double"
                 animation__saludo="property: rotation; from: 0 0 -4; to: 0 0 4; dir: alternate; loop: true; dur: 900; easing: easeInOutSine"></a-image>
      </a-entity>
      <a-image id="globoEnt" src="#globo" width="0.55" height="0.2" position="0 0.43 0.02"
               material="transparent: true; alphaTest: 0.05; opacity: 0"></a-image>
    </a-entity>
  </a-entity>
</a-scene>

<script>
  const ancla = document.querySelector('#ancla');
  const sale = document.querySelector('#sale');
  const flota = document.querySelector('#flota');
  const globo = document.querySelector('#globoEnt');
  const aviso = document.querySelector('#aviso');

  ancla.addEventListener('targetFound', () => {
    aviso.classList.add('oculto');
    // aparece desde la hoja
    sale.setAttribute('animation__pop', 'property: scale; from: 0.001 0.001 0.001; to: 1 1 1; dur: 700; easing: easeOutBack');
    sale.setAttribute('animation__z', 'property: position; from: 0 -0.05 0; to: 0 0 0.25; dur: 700; easing: easeOutQuad');
    // flota
    flota.setAttribute('animation__flota', 'property: position; from: 0 0 0; to: 0 0.03 0; dir: alternate; loop: true; dur: 1400; easing: easeInOutSine; delay: 700');
    // globo de diálogo
    globo.setAttribute('animation__globo', 'property: material.opacity; from: 0; to: 1; dur: 500; delay: 800');
  });

  ancla.addEventListener('targetLost', () => {
    aviso.classList.remove('oculto');
    sale.removeAttribute('animation__pop');
    sale.removeAttribute('animation__z');
    sale.setAttribute('scale', '0.001 0.001 0.001');
    sale.setAttribute('position', '0 -0.05 0');
    globo.removeAttribute('animation__globo');
    globo.setAttribute('material', 'opacity', 0);
  });
</script>
</body>
</html>
