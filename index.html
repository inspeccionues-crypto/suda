<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Suda en realidad aumentada</title>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: system-ui, sans-serif; }
  .a-enter-vr, .a-enter-ar { display: none !important; }
  #aviso {
    position: fixed; left: 16px; right: 16px; bottom: 24px; z-index: 10;
    background: rgba(14,58,94,.88); color: #fff; border: 3px solid #f27824;
    border-radius: 16px; padding: 12px 16px; text-align: center; font-size: 17px; line-height: 1.35;
    transition: opacity .4s;
  }
  #aviso.oculto { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="aviso">Apunta la cámara a la portada del calendario</div>

<a-scene
  mindar-image="imageTargetSrc: ./portada.mind; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001"
  color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true"
  vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item id="suda3d" src="./suda.glb"></a-asset-item>
    <img id="globo" src="./globo.png" crossorigin="anonymous">
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity light="type: ambient; intensity: 1.2"></a-entity>
  <a-entity light="type: directional; intensity: 2" position="0.5 1 2"></a-entity>

  <a-entity id="ancla" mindar-image-target="targetIndex: 0">
    <!-- Suda sale de la hoja hacia el lector -->
    <a-entity id="sale" position="0 -0.05 0" scale="0.001 0.001 0.001">
      <a-entity id="flota">
        <a-entity id="giro">
        <a-gltf-model id="modelo" src="#suda3d" scale="0.316 0.316 0.316"
                 animation__gira="property: rotation; from: 0 -20 0; to: 0 20 0; dir: alternate; loop: true; dur: 2200; easing: easeInOutSine"></a-gltf-model>
        </a-entity>
      </a-entity>
      <a-image id="globoEnt" src="#globo" width="0.55" height="0.2" position="0 0.43 0.02"
               material="transparent: true; alphaTest: 0.05; opacity: 0"></a-image>
    </a-entity>
  </a-entity>
</a-scene>

<script>
  const ancla = document.querySelector('#ancla');
  const sale = document.querySelector('#sale');
  const flota = document.querySelector('#flota');
  const globo = document.querySelector('#globoEnt');
  const aviso = document.querySelector('#aviso');

  ancla.addEventListener('targetFound', () => {
    aviso.textContent = 'Desliza el dedo sobre Suda para girarlo';
    aviso.classList.remove('oculto');
    clearTimeout(window._t); window._t = setTimeout(() => aviso.classList.add('oculto'), 3500);
    // aparece desde la hoja
    sale.setAttribute('animation__pop', 'property: scale; from: 0.001 0.001 0.001; to: 1 1 1; dur: 700; easing: easeOutBack');
    sale.setAttribute('animation__z', 'property: position; from: 0 -0.05 0; to: 0 0 0.25; dur: 700; easing: easeOutQuad');
    // flota
    flota.setAttribute('animation__flota', 'property: position; from: 0 0 0; to: 0 0.03 0; dir: alternate; loop: true; dur: 1400; easing: easeInOutSine; delay: 700');
    // globo de diálogo
    globo.setAttribute('animation__globo', 'property: material.opacity; from: 0; to: 1; dur: 500; delay: 800');
  });

  ancla.addEventListener('targetLost', () => {
    clearTimeout(window._t);
    aviso.textContent = 'Apunta la cámara a la portada del calendario';
    aviso.classList.remove('oculto');
    sale.removeAttribute('animation__pop');
    sale.removeAttribute('animation__z');
    sale.setAttribute('scale', '0.001 0.001 0.001');
    sale.setAttribute('position', '0 -0.05 0');
    globo.removeAttribute('animation__globo');
    globo.setAttribute('material', 'opacity', 0);
  });

  // Girar a Suda con el dedo (o con el mouse)
  const giro = document.querySelector('#giro');
  const modelo = document.querySelector('#modelo');
  let ultimo = null, tocado = false;
  const SENS = 0.012;
  function inicio(x, y) {
    ultimo = { x, y };
    if (!tocado) {            // al primer toque se detiene el giro automático
      tocado = true;
      modelo.removeAttribute('animation__gira');
      modelo.object3D.rotation.set(0, 0, 0);
    }
  }
  function mover(x, y) {
    if (!ultimo || !giro.object3D) return;
    const dx = x - ultimo.x, dy = y - ultimo.y;
    ultimo = { x, y };
    const o = giro.object3D;
    const qy = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), dx * SENS);
    const qx = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), dy * SENS);
    o.quaternion.premultiply(qy).premultiply(qx);
  }
  function fin() { ultimo = null; }

  window.addEventListener('touchstart', e => { if (e.touches.length === 1) inicio(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
  window.addEventListener('touchmove', e => { if (e.touches.length === 1) { e.preventDefault(); mover(e.touches[0].clientX, e.touches[0].clientY); } }, { passive: false });
  window.addEventListener('touchend', fin);
  window.addEventListener('mousedown', e => inicio(e.clientX, e.clientY));
  window.addEventListener('mousemove', e => { if (e.buttons) mover(e.clientX, e.clientY); });
  window.addEventListener('mouseup', fin);

  // Doble toque: vuelve a la posición inicial
  let ultimoToque = 0;
  window.addEventListener('touchend', () => {
    const ahora = Date.now();
    if (ahora - ultimoToque < 300) giro.object3D.quaternion.identity();
    ultimoToque = ahora;
  });
</script>
</body>
</html>
